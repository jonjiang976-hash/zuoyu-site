name: Publish article from issue

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-article
  cancel-in-progress: false

jobs:
  publish:
    # Article: the form fields are present in the body, or the title has the
    # [Article] prefix, or the "publish" label is set.
    # Patch: title starts with "[Patch]" — runs a repo-level correction instead.
    if: >-
      startsWith(github.event.issue.title, '[Patch]') ||
      contains(github.event.issue.body, '### Article title') ||
      startsWith(github.event.issue.title, '[Article]') ||
      contains(github.event.issue.labels.*.name, 'publish')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply a repo-level patch
        if: startsWith(github.event.issue.title, '[Patch]')
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -e
          # Explicit marker wins: put a line "SCRIPT: some_script.py" in the issue.
          chosen=""
          marker=$(printf '%s\n' "$ISSUE_BODY" | grep -oE 'SCRIPT:[[:space:]]*[A-Za-z0-9_.-]+' | head -1 | sed -E 's/SCRIPT:[[:space:]]*//' || true)
          if [ -n "$marker" ] && [ -f "scripts/$marker" ]; then
            chosen="scripts/$marker"
          else
            case "$ISSUE_TITLE" in
              *"product pages"*) chosen="scripts/add_product_pages.py" ;;
              *"certification"*) chosen="scripts/patch_certification.py" ;;
              *"brand"*)         chosen="scripts/brand_update.py" ;;
            esac
          fi
          if [ -z "$chosen" ]; then
            echo "No script matched this patch."
            echo "Add a line 'SCRIPT: <file>.py' to the issue body, or use a known title."
            exit 1
          fi
          echo "running $chosen"
          python "$chosen"

      - name: Build the article from the issue form
        id: build
        if: ${{ !startsWith(github.event.issue.title, '[Patch]') }}
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # If the issue says "FILE: content/xxx.md", build from that file so the
          # markdown never passes through a browser clipboard (which loses '##').
          f=$(printf '%s\n' "$ISSUE_BODY" | grep -oE 'FILE:[[:space:]]*[A-Za-z0-9_./-]+' | head -1 | sed -E 's/FILE:[[:space:]]*//' || true)
          # Browser uploads often land in the repo root instead of content/.
          # If the given path is missing, look for the same file name anywhere.
          if [ -n "$f" ] && [ ! -f "$f" ]; then
            base=$(basename "$f")
            alt=$(find . -name "$base" -not -path "./.git/*" | head -1)
            if [ -n "$alt" ]; then
              echo "path not found, using $alt instead of $f"
              f="$alt"
            fi
          fi
          if [ -n "$f" ] && [ -f "$f" ]; then
            echo "building from file: $f"
            ISSUE_BODY=$(cat "$f") python scripts/publish.py
          else
            echo "no article file found, treating the issue body as the article"
            python scripts/publish.py
          fi

      - name: Commit and push
        if: success()
        run: |
          git config user.name "zuoyu-publisher"
          git config user.email "publisher@zuoyugarment.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "content: ${{ startsWith(github.event.issue.title, '[Patch]') && 'apply certification correction' || format('publish article {0}', steps.build.outputs.slug) }}"
            git push
          fi

      - name: Ping IndexNow for the published article
        if: ${{ success() && !startsWith(github.event.issue.title, '[Patch]') }}
        env:
          LIVE_URL: ${{ steps.build.outputs.url }}
        run: |
          curl -s -o /dev/null -w "IndexNow HTTP %{http_code}\n" \
            -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"zuoyugarment.com\",\"key\":\"f113849727cee53f9d475e0db2b50adf\",\"keyLocation\":\"https://zuoyugarment.com/f113849727cee53f9d475e0db2b50adf.txt\",\"urlList\":[\"$LIVE_URL\"]}" \
            || echo "IndexNow ping failed (non-blocking)"

      - name: Comment on the issue
        if: success()
        uses: actions/github-script@v7
        env:
          LIVE_URL: ${{ steps.build.outputs.url }}
          IS_PATCH: ${{ startsWith(github.event.issue.title, '[Patch]') }}
        with:
          script: |
            const isPatch = process.env.IS_PATCH === 'true';
            const body = isPatch
              ? `Patch applied ✅\n\nFiles were corrected and committed. Cloudflare rebuilds in about a minute.`
              : `Published ✅\n\n${process.env.LIVE_URL}\n\nThe site rebuilds automatically in about a minute. The URL is also queued for IndexNow (Bing).`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });

      - name: Report failure on the issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ Failed. Open **Actions** → this run → the failing step for the reason.\n\nMost common cause: **Settings → Actions → General → Workflow permissions** is not set to **Read and write**.`
            });
