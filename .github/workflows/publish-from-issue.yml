name: Publish article from issue

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-article
  cancel-in-progress: false

jobs:
  publish:
    # Trigger if ANY of these is true: the issue form fields are in the body,
    # the title has the [Article] prefix, or a "publish" label is set.
    # The body check is the robust one — it survives a rewritten title.
    if: >-
      contains(github.event.issue.body, '### Article title') ||
      startsWith(github.event.issue.title, '[Article]') ||
      contains(github.event.issue.labels.*.name, 'publish')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the article from the issue form
        id: build
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/publish.py

      - name: Commit and push
        if: success()
        run: |
          git config user.name "zuoyu-publisher"
          git config user.email "publisher@zuoyugarment.com"
          git add blog sitemap.xml
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "content: publish article ${{ steps.build.outputs.slug }}"
            git push
          fi

      - name: Comment the live URL on the issue
        if: success()
        uses: actions/github-script@v7
        env:
          LIVE_URL: ${{ steps.build.outputs.url }}
        with:
          script: |
            const url = process.env.LIVE_URL;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Published ✅\n\n${url}\n\nThe site rebuilds automatically in about a minute. The URL is also queued for IndexNow (Bing).`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });

      - name: Report failure on the issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ Publish failed. Open the **Actions** tab → this run → the failing step to see the reason.\n\nMost common causes:\n- **Settings → Actions → General → Workflow permissions** is not set to **Read and write**\n- A required field is empty, or the meta description is over 165 characters`
            });
